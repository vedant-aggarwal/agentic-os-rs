[package]
name = "aos-server"
version = "0.1.0"
edition = "2024"
description = "Agentic OS server: Axum API, MCP over HTTP, sync, pairing, event bus"
license = "MIT"

[[bin]]
name = "aos-server"
path = "src/main.rs"

[dependencies]
aos-core.workspace = true
aos-tools.workspace = true
anyhow.workspace = true
axum.workspace = true
base64 = "0.22"
chrono.workspace = true
futures.workspace = true
# Mind OS thumbnails (<= 512 px JPEG). Same version Dioxus already pulls in.
image = { version = "0.25.10", default-features = false, features = ["jpeg", "png", "webp", "gif"] }
reqwest = { version = "0.12.28", default-features = false, features = ["json", "rustls-tls"] }
serde.workspace = true
serde_json.workspace = true
tokio = { workspace = true, features = ["fs", "process", "io-util"] }
tokio-stream.workspace = true
tokio-util.workspace = true
tower.workspace = true
tower-http.workspace = true
tracing.workspace = true
tracing-subscriber.workspace = true

[dev-dependencies]
tower = { workspace = true, features = ["util"] }
