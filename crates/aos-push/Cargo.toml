[package]
name = "aos-push"
version = "0.1.0"
edition = "2024"
description = "Agentic OS phone notifications: APNs sender, device push-token registry, event-to-push rules"
license = "MIT"

[dependencies]
aos-core.workspace = true
aos-server = { path = "../aos-server" }
aos-nora = { path = "../aos-nora" }
aos-work = { path = "../aos-work" }
aos-inbox = { path = "../aos-inbox" }
anyhow.workspace = true
axum.workspace = true
base64 = "0.22"
dirs.workspace = true
rusqlite.workspace = true
serde.workspace = true
serde_json.workspace = true
tokio.workspace = true
tracing.workspace = true
# APNs speaks HTTP/2 only. Same reqwest as the rest of the tree, plus `http2` (h2 is already in the lock).
reqwest = { version = "0.12.28", default-features = false, features = ["json", "rustls-tls", "http2"] }
# ES256 for the APNs provider token. Already in the tree through rustls.
ring = "0.17.14"

[dev-dependencies]
tokio = { workspace = true, features = ["macros", "rt-multi-thread"] }
tower = { workspace = true, features = ["util"] }
