[package]
name = "aos-nora"
version = "0.1.0"
edition = "2024"
description = "Nora runtime: one merged thread, Claude engine, Grok Bot read side, memory, alarms, heartbeat"
license = "MIT"

[dependencies]
aos-core.workspace = true
aos-tools.workspace = true
aos-server = { path = "../aos-server" }
# Reuses the Work tab's process supervisor, stream-json translator and CLI discovery.
aos-work = { path = "../aos-work" }
anyhow.workspace = true
axum.workspace = true
chrono.workspace = true
dirs.workspace = true
futures.workspace = true
rusqlite.workspace = true
schemars.workspace = true
serde.workspace = true
serde_json.workspace = true
tokio = { workspace = true, features = ["process", "io-util", "fs"] }
tokio-stream.workspace = true
tokio-util.workspace = true
tracing.workspace = true
notify = "8"
notify-debouncer-mini = "0.7"
data-encoding = "2.11"

[dev-dependencies]
tokio = { workspace = true, features = ["test-util"] }
