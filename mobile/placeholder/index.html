<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Agentic OS</title>
<style>
  :root { color-scheme: dark; }
  html, body { margin: 0; height: 100%; background: #0b0c12; color: #e9eaf2;
    font: 16px/1.45 -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; }
  main { min-height: 100%; display: grid; place-content: center; gap: 12px; padding: 24px; text-align: center; }
  h1 { margin: 0; font-size: 28px; font-weight: 650; letter-spacing: -0.01em; }
  p { margin: 0; color: #a3a6b8; }
  code { color: #c9c2ff; }
</style>
</head>
<body>
<main>
  <h1>Agentic OS</h1>
  <p>Phone shell is running.</p>
  <p id="where">Placeholder page: the React build in <code>web/dist</code> replaces it.</p>
</main>
<script>
  // Shows which native layer answered, so a screenshot proves the bridge is up.
  const cap = window.Capacitor;
  if (cap) document.getElementById('where').textContent =
    'Native shell: ' + cap.getPlatform() + '. The React build in web/dist replaces this page.';
</script>
</body>
</html>
